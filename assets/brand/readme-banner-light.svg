<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <title>FuckCaptcha — the field guide to 39 CAPTCHA types</title>
  <defs>
    <linearGradient id="rbl-mark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0066ff"/>
      <stop offset="1" stop-color="#00a6c4"/>
    </linearGradient>
    <linearGradient id="rbl-accent" x1="280" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0066ff"/>
      <stop offset="1" stop-color="#00a6c4"/>
    </linearGradient>
    <radialGradient id="rbl-glow" cx="1110" cy="35" r="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b9dff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rbl-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#d7e1ee" stroke-width="1"/>
    </pattern>
    <linearGradient id="rbl-mask" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".8"/>
    </linearGradient>
    <mask id="rbl-grid-mask">
      <rect width="1280" height="320" fill="url(#rbl-mask)"/>
    </mask>
    <filter id="rbl-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#27466f" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="#f4f7fc"/>
  <rect width="1280" height="320" rx="28" fill="url(#rbl-grid)" mask="url(#rbl-grid-mask)"/>
  <rect width="1280" height="320" rx="28" fill="url(#rbl-glow)"/>

  <g transform="translate(64 72) scale(.34375)">
    <rect width="512" height="512" rx="120" fill="url(#rbl-mark)"/>
    <path d="M188 136 96 256l92 120M324 136l92 120-92 120" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M206 262l40 40 64-92" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  </g>

  <text x="282" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3.5" fill="#0066cc">OPEN CAPTCHA KNOWLEDGE BASE</text>
  <text x="278" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#0b1526">Fuck<tspan fill="url(#rbl-accent)">Captcha</tspan><tspan fill="#00a6c4">.</tspan></text>
  <text x="282" y="236" font-family="Inter, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" fill="#52647d">39 CAPTCHA types · detection signals · documented options</text>

  <g transform="translate(1004 66) rotate(8 100 100)" filter="url(#rbl-shadow)">
    <rect width="200" height="200" rx="28" fill="#fff" stroke="#d7e1ee" stroke-width="2"/>
    <g fill="#f0f5fb" stroke="#e1e9f2" stroke-width="1">
      <rect x="16" y="16" width="52" height="52" rx="8"/><rect x="74" y="16" width="52" height="52" rx="8"/><rect x="132" y="16" width="52" height="52" rx="8"/>
      <rect x="16" y="74" width="52" height="52" rx="8"/><rect x="74" y="74" width="52" height="52" rx="8"/><rect x="132" y="74" width="52" height="52" rx="8"/>
      <rect x="16" y="132" width="52" height="52" rx="8"/><rect x="74" y="132" width="52" height="52" rx="8"/><rect x="132" y="132" width="52" height="52" rx="8"/>
    </g>
    <g fill="none" stroke="#0066ff" stroke-width="3">
      <rect x="74" y="16" width="52" height="52" rx="8"/><rect x="16" y="74" width="52" height="52" rx="8"/><rect x="132" y="132" width="52" height="52" rx="8"/>
    </g>
    <g fill="none" stroke="#0066ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m88 42 8 8 16-18M30 100l8 8 16-18M146 158l8 8 16-18"/>
    </g>
