<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="title desc">
  <title id="title">ARCaptcha widget illustration</title>
  <desc id="desc">An ARCaptcha "I'm not robot" checkbox with the purple ARCaptcha cloud logo above a Login button.</desc>
  <defs>
    <linearGradient id="arc-bg" x1="0" y1="0" x2="880" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef1f8"/>
      <stop offset="1" stop-color="#f4f2ff"/>
    </linearGradient>
    <linearGradient id="arc-cloud" x1="540" y1="134" x2="597" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c6cf0"/>
    </linearGradient>
    <filter id="arc-shadow" x="200" y="40" width="480" height="320" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e2a44" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="880" height="400" rx="28" fill="url(#arc-bg)"/>
  <circle cx="118" cy="92" r="58" fill="#e4e0ff"/>
  <circle cx="770" cy="320" r="84" fill="#e2e8f7"/>

  <g filter="url(#arc-shadow)">
    <rect x="230" y="85" width="420" height="230" rx="20" fill="#fff"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <rect x="262" y="117" width="356" height="96" rx="8" fill="#fff" stroke="#e2e6ec" stroke-width="1.5"/>
    <rect x="284" y="147" width="36" height="36" rx="8" fill="#fff" stroke="#7c6cf0" stroke-width="3"/>
    <text x="338" y="171" font-size="17" font-weight="700" fill="#1f2533">I’m not robot</text>

    <g fill="url(#arc-cloud)">
      <circle cx="552" cy="163" r="12"/>
      <circle cx="568" cy="151" r="17"/>
      <circle cx="585" cy="163" r="12"/>
      <rect x="540" y="159" width="57" height="16" rx="8"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".92">
      <path d="M562 175a6 6 0 0 1 12 0"/>
      <path d="M556 175a12 12 0 0 1 24 0"/>
      <path d="M550 175a18 18 0 0 1 36 0"/>
    </g>
    <text x="568" y="197" font-size="11" fill="#4b5563" text-anchor="middle">ARCaptcha</text>

    <rect x="262" y="237" width="356" height="46" rx="8" fill="#2563eb"/>
    <text x="440" y="266" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Login</text>
  </g>
</svg>
